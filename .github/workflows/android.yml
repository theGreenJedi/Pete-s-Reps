name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '15859902'
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Test and build debug APK
        run: gradle :app:testDebugUnitTest :app:assembleDebug
      - name: Smoke-test release configuration without signing secrets
        run: gradle :app:assembleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: petes-reps-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
